services:
  pm-postgres:
    image: pgvector/pgvector:pg16
    container_name: pm-postgres
    environment:
      POSTGRES_DB: pm_system
      POSTGRES_USER: pm_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    # 不对外暴露端口，只在 Docker 网络内访问（避免和服务器已有的 5432 冲突）
    expose:
      - "5432"
    volumes:
      - pm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_admin -d pm_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - pm-net

  pm-redis:
    image: redis:7-alpine
    container_name: pm-redis
    # 不对外暴露端口，只在 Docker 网络内访问（避免和服务器已有的 6379 冲突）
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - pm-net

  pm-backend:
    build: ./backend
    container_name: pm-backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pm_admin:${DB_PASSWORD:-changeme}@pm-postgres:5432/pm_system
      REDIS_URL: redis://pm-redis:6379/0
    depends_on:
      pm-postgres:
        condition: service_healthy
      pm-redis:
        condition: service_healthy
    volumes:
      - pm-uploads:/data/uploads
    restart: always
    networks:
      - pm-net

  pm-frontend:
    build: ./frontend
    container_name: pm-frontend
    ports:
      - "3040:80"
    depends_on:
      - pm-backend
    restart: always
    networks:
      - pm-net

volumes:
  pm-pgdata:
  pm-uploads:

networks:
  pm-net:
    name: pm-net
