spring:
  datasource:
    url: jdbc:sqlite:${app.data-dir:./data}/helpmanual.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 20
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m

app:
  data-dir: ./data
  upload-dir: ./uploads
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-32-chars}
    expiration-ms: 86400000

server:
  port: 8080
